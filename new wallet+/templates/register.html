{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold mb-2">Create Account</h1>
            <p class="text-emerald-400">Start your crypto journey</p>
        </div>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                <div class="bg-red-500/20 border border-red-500 text-red-200 px-4 py-3 rounded-2xl mb-6 text-center">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm mb-2 text-white/70">Full Name</label>
                <input type="text" name="name" required
                       class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500 smooth-transition">
            </div>
            <div>
                <label class="block text-sm mb-2 text-white/70">Email Address</label>
                <input type="email" name="email" required
                       class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500 smooth-transition">
            </div>
            <div>
                <label class="block text-sm mb-2 text-white/70">Password</label>
                <input type="password" name="password" required
                       class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500 smooth-transition">
            </div>
            
            <button type="submit" onclick="showLoading()"
                    class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 rounded-2xl text-xl font-semibold smooth-transition">
                Create Account
            </button>
        </form>
        
        <div class="text-center mt-8">
            <a href="{{ url_for('login') }}" onclick="showLoading()" 
               class="text-emerald-400 hover:text-emerald-300 smooth-transition">
                Already have an account? Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
